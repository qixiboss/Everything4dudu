<!DOCTYPE html>
<html lang="zh-CN" data-app="training">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F5F4F0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src https://nhqncjwfspaxlggmsoxg.supabase.co wss://nhqncjwfspaxlggmsoxg.supabase.co; img-src 'self' data:; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'; frame-src 'none'">
<title>训练记录</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23191B21'/><text x='50' y='72' font-size='58' text-anchor='middle' fill='%23E03B27' font-family='ui-monospace,monospace' font-weight='bold'>T</text></svg>">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="../shared/hub.css">
</head>
<body>
<div id="hub-shell"></div>

<header class="topbar">
  <div class="topbar-inner">
    <span class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="5" r="3" fill="#E03B27" stroke="none"/><circle cx="6" cy="19" r="3" fill="#E03B27" stroke="none"/><line x1="6" y1="8" x2="6" y2="16"/><circle cx="18" cy="5" r="3" fill="#2E7D52" stroke="none"/><circle cx="18" cy="19" r="3" fill="#2E7D52" stroke="none"/><line x1="18" y1="8" x2="18" y2="16"/><line x1="9" y1="12" x2="15" y2="12"/></svg>
      <span id="brand-label">训练记录</span>
    </span>
    <nav class="tabs" id="tabs">
      <button class="tab active" data-view="today">今日训练</button>
      <button class="tab" data-view="heat">热力图</button>
      <button class="tab" data-view="history">历史记录</button>
    </nav>
    <div class="tools">
      <button class="tool" id="btn-pause" aria-label="暂停计时">
        <svg id="icon-pause" viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><rect x="6" y="4" width="4" height="16" rx="1.5"/><rect x="14" y="4" width="4" height="16" rx="1.5"/></svg>
        <svg id="icon-play" viewBox="0 0 24 24" width="18" height="18" fill="currentColor" style="display:none" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.53.85l10.2-6.5a1 1 0 0 0 0-1.7L9.53 4.65A1 1 0 0 0 8 5.5z"/></svg>
        <span class="tool-text" id="pause-label">暂停计时</span>
      </button>
      <button class="tool" id="btn-settings" aria-label="打开设置">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span class="tool-text">设置</span>
      </button>
    </div>
  </div>
</header>

<main class="main">
  <!-- 今日 -->
  <section class="view" id="view-today">
    <div class="today-head">
      <div>
        <h1>今天的训练</h1>
        <p class="today-date" id="today-date"></p>
        <div class="head-progress"><div class="head-progress-fill" id="head-progress"></div></div>
      </div>
      <button class="btn ghost" id="finish-early" style="display:none">提前结束训练</button>
    </div>
    <div id="today-body"></div>
  </section>

  <!-- 热力图 -->
  <section class="view" id="view-heat" hidden>
    <div class="card">
      <div class="card-head">
        <h2>最近一个月</h2>
        <span class="card-sub" id="heat-sub"></span>
      </div>
      <div class="stats" id="heat-stats"></div>
      <div class="heat-wrap">
        <div class="heat-grid flat" id="heat-grid"></div>
      </div>
      <div class="legend">
        <span>少</span>
        <span class="lcell l1"></span><span class="lcell l2"></span>
        <span class="lcell l3"></span><span class="lcell l4"></span>
        <span>多</span>
      </div>
    </div>
  </section>

  <!-- 历史 -->
  <section class="view" id="view-history" hidden>
    <div class="card" style="padding-top:14px">
      <div class="card-head">
        <h2>历史记录</h2>
        <span class="card-sub" id="hist-sub"></span>
      </div>
      <div id="hist-list"></div>
    </div>
  </section>
</main>

<div id="tooltip"></div>
<div id="toast"></div>

<dialog id="dlg-settings">
  <div class="set-form">
    <h2>设置</h2>
    <p class="sub-title">每组的默认目标 · 顺序即计划排布</p>
    <div id="set-defaults"></div>
    <div class="set-row">
      <label>组间建议休息（秒）</label>
      <input type="number" id="set-rest" min="1" max="600" step="5">
      <span class="unit">秒</span>
    </div>
    <div class="set-row">
      <label>今日完成后自动切换跑步 / 骑行</label>
      <input type="checkbox" class="switch" id="set-alt">
    </div>
    <p class="set-hint" id="set-hint"></p>
    <div class="dialog-actions">
      <button class="btn ghost" id="set-cancel">取消</button>
      <button class="btn primary" id="set-save" style="min-width:0;height:42px;padding:0 22px;font-size:14px">保存</button>
    </div>
  </div>
</dialog>

<!-- 门户运行时：统一登录、路由保护、跨端同步与返回主页。此处是直接维护的源码。 -->
<script defer src="../shared/vendor/supabase.js"></script>
<script defer src="../shared/config.js"></script>
<script defer src="../shared/hub-auth.js"></script>
<script defer src="../shared/auth-gate.js"></script>
<script defer src="../shared/sync-store.js"></script>
<script defer src="../shared/hub-sync.js"></script>
<script defer src="../shared/hub-shell.js"></script>
<script defer src="hub-sync.js"></script>
<script defer src="model.js"></script>
<script defer src="app.js"></script>
</body>
</html>
