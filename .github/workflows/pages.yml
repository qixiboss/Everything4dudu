name: Deploy unified portal to GitHub Pages

# 推送门户时构建并部署。三个应用目录在构建时从各自仓库检出最新 main,
# 整合后输出到 _site/;应用仓库的推送只更新它们自己的 Pages。
on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check out WordTales (words)
        uses: actions/checkout@v6
        with:
          repository: qixiboss/WordTales
          path: words
      - name: Check out training record (training)
        uses: actions/checkout@v6
        with:
          repository: qixiboss/Train_record
          path: training
      - name: Check out exam schedule (exam-schedule)
        uses: actions/checkout@v6
        with:
          repository: qixiboss/-Graduate-Entrance-Exam-Schedule
          path: exam-schedule
      - uses: actions/setup-node@v6
        with: { node-version: 22 }
      - run: npm run verify
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with: { path: _site }
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
