name: Deploy unified portal to GitHub Pages

# 推送门户时构建并部署。三个应用以子模块登记在门户仓库里(见 .gitmodules),
# 检出时按登记的指针拉取,整合后输出到 _site/;应用仓库的推送只更新它们
# 自己的 Pages,门户要带上新版本需在门户提交中更新对应子模块指针。
on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-node@v6
        with: { node-version: 22 }
      - run: npm run verify
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with: { path: _site }
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
