name: Sync upstream applications

on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
  repository_dispatch:
    types: [upstream-app-updated]

permissions:
  contents: read

concurrency:
  group: sync-upstream-applications
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - name: Check out portal
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check out WordTales
        uses: actions/checkout@v6
        with:
          repository: qixiboss/WordTales
          path: _upstreams/WordTales

      - name: Check out training record
        uses: actions/checkout@v6
        with:
          repository: qixiboss/Train_record
          path: _upstreams/Train_record

      - name: Check out exam schedule
        uses: actions/checkout@v6
        with:
          repository: qixiboss/-Graduate-Entrance-Exam-Schedule
          path: _upstreams/GraduateSchedule

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Generate integrated applications
        run: npm run sync:upstreams

      - name: Verify generated portal
        run: npm run verify

      - name: Commit upstream changes
        id: commit
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- words training exam-schedule upstreams.json)" ]; then
            echo "All applications already match their upstream repositories."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add words training exam-schedule upstreams.json
          git commit -m "sync upstream applications"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the synced default branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm run verify
      - run: npm run build
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
